[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digistrat"
version = "1.0.0"
description = "KI-gestützter Methodenkoffer für Digitalisierungsstrategien produzierender Unternehmen"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1",
  "python-pptx>=1.0",
  "pyyaml>=6.0",
  "pandas>=2.0",
  "anthropic>=2.8",
  "python-docx>=1.1",
]

[project.optional-dependencies]
app = ["streamlit>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
digistrat = "digistrat.cli:main"

[tool.setuptools]
packages = ["digistrat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
